# Load the local development environment when run from the project directory.
spring.config.import=optional:file:./.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${SOFTIQ_DB_URL}
spring.datasource.username=${SOFTIQ_DB_USERNAME}
spring.datasource.password=${SOFTIQ_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.devtools.restart.enabled=false
spring.main.allow-bean-definition-overriding=true
# mail
spring.mail.host=smtp.cesky-hosting.cz
spring.mail.port=587
spring.mail.username=${SOFTIQ_MAIL_USERNAME}
spring.mail.password=${SOFTIQ_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#connections
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
#captcha
recaptcha.secret=${RECAPTCHA_SECRET}
#secrets
secret.automation.password=${SOFTIQ_AUTOMATION_PASSWORD}
secret.jwt.key=${SOFTIQ_JWT_KEY}

spring.profiles.active=${SPRING_PROFILE_ACTIVE:prod,prod-scheduled}
scheduling.enabled=false
spring.main.web-application-type=none
softiq.watchdog.runner.image=${SOFTIQ_WATCHDOG_RUNNER_IMAGE:softiq-watchdog-app:4.1.0}
softiq.api.base-url=${SOFTIQ_API_BASE_URL:}
softiq.api.test.email=${SOFTIQ_API_TEST_EMAIL:}
softiq.api.test.password=${SOFTIQ_API_TEST_PASSWORD:}