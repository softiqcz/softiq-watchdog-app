import javax.inject.Inject
import org.gradle.process.ExecOperations

abstract class DeploymentProcesses {
    @Inject
    abstract ExecOperations getExecOperations()
}
def deploymentProcesses = objects.newInstance(DeploymentProcesses).execOperations

// Deployment is defined entirely in Gradle; no external shell scripts.
def deploymentHost = 'svemar@svemar04.local'
def deploymentDirectory = 'MyApps/softiq-watchdog-v2'

tasks.register('deployDockerfile') {
    group = 'deployment'
    description = 'Upload only Dockerfile to svemar04; do not build or start containers'
    doLast {
        deploymentProcesses.exec {
            commandLine 'ssh', deploymentHost, "mkdir -p ${deploymentDirectory}"
        }.assertNormalExitValue()
        deploymentProcesses.exec {
            commandLine 'rsync', '-avz', file('Dockerfile').absolutePath,
                    "${deploymentHost}:${deploymentDirectory}/"
        }.assertNormalExitValue()
    }
}

tasks.register('upload-to-svemar04') {
    group = 'deployment'
    description = 'Build/check and upload the application, rebuild image and replace only v2 containers; keep remote Dockerfile'
    dependsOn tasks.named('check'), tasks.named('bootJar')
    doLast {
        deploymentProcesses.exec {
            commandLine 'ssh', deploymentHost, "mkdir -p ${deploymentDirectory}/build/libs"
        }.assertNormalExitValue()
        deploymentProcesses.exec {
            commandLine 'rsync', '-avz', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath,
                    "${deploymentHost}:${deploymentDirectory}/build/libs/"
        }.assertNormalExitValue()
        def remoteCommands = '''
set -euo pipefail
export PATH="/usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"
cd "$HOME/MyApps/softiq-watchdog-v2"
test -f Dockerfile || { echo 'Remote Dockerfile missing; run ./gradlew deployDockerfile first.' >&2; exit 1; }
test -f watchdog.env || { echo 'Create watchdog.env before deployment; see README.' >&2; exit 1; }
image="softiq-watchdog-app-v2:$1"
# Reuse the existing server's actual bind mount; do not recreate it.
screenshots="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/usr/share/nginx/html"}}{{.Source}}{{end}}{{end}}' softiq-test-screenshots)"
test -n "$screenshots" && test -d "$screenshots" || { echo 'Existing screenshot server bind mount was not found.' >&2; exit 1; }
# Build successfully before replacing this installation's containers.
docker build -t "$image" .
# Exact v2 names only; preserve legacy and screenshot containers.
for container in softiq-watchdog-app-v2 watchdog-sync-professional-v2 watchdog-sync-often-v2 watchdog-sync-daily-v2 watchdog-sync-weekly-v2 run-in-morning-suite-v2 softiq-suite-v2 makon-agents-sync-v2; do
  if docker container inspect "$container" >/dev/null 2>&1; then
    docker stop "$container"
    docker rm "$container"
  fi
done
docker run -d --name softiq-watchdog-app-v2 --restart unless-stopped \\
  --env-file watchdog.env -e TZ=Europe/Prague -e SPRING_PROFILE_ACTIVE=prod,prod-scheduled \\
  -e SOFTIQ_WATCHDOG_RUNNER_IMAGE="$image" -e SOFTIQ_DOCKER_SCREENSHOT_HOST_DIR="$screenshots" \\
  -e SOFTIQ_TEST_SCREENSHOT_BASE_URL=http://svemar04.local:8081 \\
  -v /var/run/docker.sock:/var/run/docker.sock \\
  -v "$PWD/watchdog.env:/app/config/watchdog.env:ro" \\
  -v "$screenshots:/app/build/screenshots" "$image"
docker run -d --name watchdog-sync-professional-v2 --restart unless-stopped \\
  --env-file watchdog.env -e TZ=Europe/Prague -e SPRING_PROFILE_ACTIVE=prod \\
  -e MODE_SELECTOR=html -e SOFTIQ_TEST_SCREENSHOT_DIR=/app/build/screenshots \\
  -e SOFTIQ_TEST_SCREENSHOT_BASE_URL=http://svemar04.local:8081 \\
  -v "$screenshots:/app/build/screenshots" --ipc=host \\
  "$image" bash -c 'Xvfb :99 -screen 0 1920x1080x24 & export DISPLAY=:99; exec java -jar /app/app.jar watchdog/watchDogSyncProfessional.xml'
'''
        deploymentProcesses.exec {
            commandLine 'ssh', deploymentHost, 'bash', '-s', '--', project.version.toString().replaceFirst(/-RELEASE$/, '')
            standardInput = new ByteArrayInputStream(remoteCommands.getBytes('UTF-8'))
        }.assertNormalExitValue()
    }
}

// Compatibility alias for the complete application deployment.
tasks.register('deployDocker-svemar04') {
    group = 'deployment'
    description = 'Alias for upload-to-svemar04 (application deployment, excluding Dockerfile upload)'
    dependsOn tasks.named('upload-to-svemar04')
}
