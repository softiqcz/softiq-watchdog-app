plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.20.0'
}
group = 'cz.softiq'
version = '5.0.0-RELEASE'
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
spotless {
    java {
        googleJavaFormat('1.17.0')
        target 'src/**/*.java'
    }
}
repositories {
    if (providers.gradleProperty('useMavenLocal').isPresent()) { mavenLocal() }
    mavenCentral()
    ['cz.softiq.core': 'softiq-core-app', 'cz.softiq.watchdog': 'softiq-watchdog-core'].each { packageGroup, repository ->
        maven {
            url = uri("https://maven.pkg.github.com/softiqcz/${repository}")
            credentials {
                username = findProperty('github.username') ?: System.getenv('GITHUB_USERNAME')
                password = findProperty('github.token') ?: System.getenv('GITHUB_TOKEN')
            }
            content { includeGroup packageGroup }
        }
    }
}
test { useTestNG() }
// Keep the historical task name for callers, but publish one executable Boot JAR.
tasks.register('shadowJar') { dependsOn tasks.named('bootJar') }
tasks.named('jar') { enabled = false }

springBoot { mainClass = 'cz.softiq.watchdog.WatchdogApplication' }
// Operational suites are packaged separately from ordinary unit tests.
sourceSets { automation {} }
configurations {
    automationImplementation.extendsFrom implementation
    automationRuntimeOnly.extendsFrom runtimeOnly
    automationAnnotationProcessor.extendsFrom annotationProcessor
}
dependencies {
    implementation 'cz.softiq.watchdog:softiq-watchdog-core:1.0.1'
    implementation 'org.jsoup:jsoup:1.21.1'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    // A declared dependency also exposes main output to IntelliJ's module classpath.
    automationImplementation sourceSets.main.output
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'com.h2database:h2'
}

bootJar {
    dependsOn tasks.named('automationClasses')
    classpath += sourceSets.automation.output
}

tasks.register('verifyWatchdogArtifact') {
    group = 'verification'
    dependsOn tasks.named('bootJar')
    doLast {
        new java.util.zip.ZipFile(tasks.named('bootJar').get().archiveFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            ['cz/softiq/watchdog/WatchdogApplication.class',
             'cz/softiq/service/watchdog/service/schedule/ScheduleService.class',
             'cz/softiq/tests/watchdog/WatchDogs.class',
             'watchdog/watchDogSyncProfessional.xml',
             'clients/runInMorningSuite.xml'].each { required ->
                if (!names.contains("BOOT-INF/classes/${required}".toString()))
                    throw new GradleException("Watchdog payload is missing ${required}")
            }
            if (names.any { it.startsWith('BOOT-INF/classes/') && it.contains('/controller/') })
                throw new GradleException('Watchdog contains API controllers')
            if (names.any { it.contains('/cz/softiq/isolation/') })
                throw new GradleException('Isolated tests must not be packaged')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyWatchdogArtifact') }

apply from: 'gradle/deploy.gradle'
